{% set version = "0.9.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-distributional
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/distributional_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/distributional/distributional_{{ version }}.tar.gz
  sha256: 1ed9f98e6366665db372b6a048c1b598c66a03e104e572472c96417642bf7226

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-generics
    - r-lifecycle
    - r-numderiv
    - r-pillar
    - r-rlang >=0.4.5
    - r-vctrs >=0.3.0
  run:
    - r-base
    - r-generics
    - r-lifecycle
    - r-numderiv
    - r-pillar
    - r-rlang >=0.4.5
    - r-vctrs >=0.3.0

test:
  commands:
    - $R -e "library('distributional')"           # [not win]
    - "\"%R%\" -e \"library('distributional')\""  # [win]

about:
  home: https://pkg.mitchelloharawild.com/distributional/
  dev_url: https://github.com/mitchelloharawild/distributional
  license: GPL-3.0-only
  summary: Vectorised distribution objects with tools for manipulating, visualising, and using probability distributions. Designed to allow model prediction outputs to return distributions rather than their parameters, allowing users to directly interact with predictive distributions in a data-oriented workflow. In 
    addition to providing generic replacements for p/d/q/r functions, other useful statistics can be computed including means, variances, intervals, and highest density regions.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r

# Package: distributional
